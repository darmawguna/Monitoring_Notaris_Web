# NotarisKu - Production Docker Compose
# Usage: docker compose up -d

services:
  # ======================
  # PHP-FPM (Laravel App)
  # ======================
  app:
    build:
      context: .
      dockerfile: dockerfile
      target: production
    container_name: notarisku_app
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
    volumes:
      - app_public:/var/www/html/public
      - app_storage:/var/www/html/storage/app/public
      - app_logs:/var/www/html/storage/logs
    expose:
      - "9000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ======================
  # Nginx (Web Server)
  # ======================
  web:
    image: nginx:1.27-alpine
    container_name: notarisku_web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage/app/public:ro
    ports:
      - "127.0.0.1:9002:80"
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ======================
  # MySQL Database
  # ======================
  db:
    image: mysql:8.0
    container_name: notarisku_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_INITDB_SKIP_TZINFO: 1
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --innodb-log-file-size=64M
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-flush-method=O_DIRECT
      - --max-connections=100
      - --max-allowed-packet=64M
      - --slow-query-log=1
      - --long-query-time=2
    volumes:
      - db_data:/var/lib/mysql
      - db_backups:/backups
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ======================
  # Queue Worker
  # ======================
  queue:
    build:
      context: .
      dockerfile: dockerfile
      target: production
    container_name: notarisku_queue
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
    volumes:
      - app_storage:/var/www/html/storage/app/public
      - app_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    command: php artisan queue:work --sleep=3 --tries=3 --max-jobs=1000 --max-time=3600

  # ======================
  # Scheduler (Cron)
  # ======================
  scheduler:
    build:
      context: .
      dockerfile: dockerfile
      target: production
    container_name: notarisku_scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
    volumes:
      - app_storage:/var/www/html/storage/app/public
      - app_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
    driver: local
  db_backups:
    driver: local
  app_storage:
    driver: local
  app_logs:
    driver: local
  app_public:
    driver: local
