name: Deploy to VPS

on:
  push:
    branches: [production]

jobs:
  deploy:
    name: Deploy NotarisKu to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e

            PROJECT_DIR="/home/projectdarma/Monitoring_Notaris_Web"
            cd "$PROJECT_DIR"

            echo "🔄 Pulling latest code..."
            git fetch origin production
            git reset --hard origin/production

            echo "📦 Pulling latest Docker image..."
            docker compose pull app 2>/dev/null || true

            echo "🏗️ Building images..."
            docker compose build --pull

            echo "🚀 Rolling update..."
            docker compose up -d --remove-orphans

            echo "⏳ Waiting for app to be healthy..."
            sleep 15

            echo "🔧 Running migrations..."
            docker compose exec -T app php artisan migrate --force

            echo "🧹 Optimizing..."
            docker compose exec -T app php artisan optimize:clear
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
            docker compose exec -T app php artisan event:cache

            echo "🔗 Storage link..."
            docker compose exec -T app php artisan storage:link 2>/dev/null || true

            echo "🔁 Reloading reverse proxy..."
            sudo systemctl reload caddy 2>/dev/null || sudo systemctl reload nginx 2>/dev/null || true

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Deployment completed!"
